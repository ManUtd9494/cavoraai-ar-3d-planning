<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CavoraAI AR 3D Building Planning - Live-Demo Musterbüro</title>
<meta name="description" content="Live-Demo: begehbares 3D-Musterbüro mit AR-Massen, Fachebenen und AR-Export. Fiktives Beispiel, keine Kundendaten.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#dde7f1;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#0B1526}
#app{position:fixed;inset:0}#app canvas{display:block}
.labels{position:absolute;inset:0;pointer-events:none}
.lbl{transition:opacity .15s;white-space:nowrap;pointer-events:none}
.lbl.stamp{background:rgba(255,255,255,.9);border-top:2px solid #0A2463;padding:4px 8px;font-size:12px;text-align:center;box-shadow:0 1px 6px rgba(10,36,99,.12)}
.lbl.stamp b{color:#0A2463}.lbl.stamp span{color:#3F4A63;font-size:11px}
.lbl.stamp.sel{border-top-color:#1E56A0}
.lbl.dim{background:#1E56A0;color:#fff;font:600 11px/1.2 ui-monospace,"IBM Plex Mono",Menlo,monospace;padding:2px 6px;border-radius:2px}
.lbl.dim.small{background:#fff;color:#1E56A0;border:1px solid #1E56A0;font-size:10px;padding:1px 4px}
.lbl.dim.chain{background:transparent;color:#0A2463;font-size:10px;padding:0}
.lbl.dim.h{background:#047857}
.lbl.dim.meas{background:#0A2463;text-align:center}.lbl.dim.meas span{font-weight:400;font-size:10px}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
.card{position:absolute;background:rgba(255,255,255,.94);border-top:2px solid #0A2463;box-shadow:0 2px 14px rgba(10,36,99,.12)}
.head{top:14px;left:14px;padding:10px 14px;max-width:360px}
.eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7C879E}.eyebrow:before{content:"";display:inline-block;width:14px;height:1px;background:#7C879E;vertical-align:middle;margin-right:6px}
.ttl{font-weight:650;font-size:16px;color:#0A2463;margin-top:2px}.sub{font-size:11px;color:#3F4A63;margin-top:2px}
.bar{top:14px;right:14px;padding:10px;width:250px;display:flex;flex-direction:column;gap:8px}
.bar button,.pad button{font:500 12px system-ui,sans-serif;border:1px solid #CBD2DE;background:#fff;color:#0B1526;padding:6px 8px;cursor:pointer}
.bar button.on{background:#0A2463;color:#fff;border-color:#0A2463}
.seg{display:grid;grid-template-columns:1fr 1fr}.seg button{font-weight:600}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:4px}.row{display:grid;grid-template-columns:1fr 56px;gap:4px}
select{font:12px system-ui;padding:6px;border:1px solid #CBD2DE;background:#fff}
.leg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:#3F4A63}.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.help{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);padding:7px 12px;font-size:12px;color:#3F4A63;max-width:70vw;text-align:center}
.note{position:absolute;bottom:52px;left:330px;right:290px;margin:auto;max-width:900px;font-size:10px;color:#7C879E;text-align:center;pointer-events:none}
#mini{position:absolute;bottom:14px;left:14px;width:300px;height:200px;border-top:2px solid #0A2463;box-shadow:0 2px 14px rgba(10,36,99,.12);cursor:pointer}
.pad{position:absolute;right:14px;bottom:70px;display:none;flex-direction:column;align-items:center;gap:4px}.pad button{width:46px;height:46px;font-size:18px}
#tip{position:fixed;display:none;background:#fff;border-top:2px solid #1E56A0;padding:6px 9px;font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.15);pointer-events:none;z-index:10;max-width:280px}
#tip .mut{color:#7C879E;font-size:10px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;color:#0A2463;font-size:14px;z-index:20}
@media (max-width:760px){.head{max-width:60vw}.bar{width:200px}#mini{width:180px;height:120px}.note{display:none}}

.bar{max-height:calc(100vh - 28px);overflow:auto;box-sizing:border-box}
.hd{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7C879E;margin-top:2px}
.ly button{text-align:left;font-size:11.5px}.ly button i,.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.bar button.pri,.arp button.pri{background:#1E56A0;color:#fff;border-color:#1E56A0;font-weight:600;padding:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 48px;gap:4px}
.secrow{display:flex;flex-direction:column;gap:2px;font-size:11px;color:#3F4A63}.secrow input{width:100%}
.leg{display:flex;flex-direction:column;gap:6px}.leg .lg{display:flex;flex-direction:column;gap:2px}.leg .lg b{font-size:11.5px;color:#0B1526}.leg .lg span{padding-left:15px}.leg .mut{color:#7C879E;font-size:10px}
.lbl.stamp .nt{color:#7C879E;font-size:10px}
.lbl.energy{background:rgba(255,251,235,.95);border-left:3px solid #CA8A04;padding:3px 7px;font-size:10.5px;color:#3F4A63;text-align:left}.lbl.energy b{color:#0B1526}
.prod,.arp{display:none;right:280px;top:14px;width:300px;padding:12px 14px;font-size:12px}
.prod .ttl2,.arp .ttl2{font-weight:650;font-size:15px;color:#0A2463;margin:2px 0 8px}
.prod table{border-collapse:collapse;width:100%}.prod td{border-top:1px solid #E6E9F0;padding:5px 4px;vertical-align:top}.prod td:first-child{color:#7C879E;width:38%}
.prod .mut,.arp .mut{color:#7C879E;font-size:10.5px;margin-top:8px}
.arp p{color:#3F4A63;line-height:1.4}.arp button{font:500 12px system-ui;border:1px solid #CBD2DE;background:#fff;padding:7px;cursor:pointer;width:100%;margin-top:6px}
.arp .row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:18px;color:#7C879E;cursor:pointer;width:auto!important;margin:0!important;padding:0 4px!important}
#xrui{display:none;position:fixed;inset:auto 0 24px 0;flex-direction:column;align-items:center;gap:8px;z-index:30}
#xrui .xrhint{background:rgba(255,255,255,.92);padding:8px 12px;font-size:13px;color:#0B1526;max-width:80vw;text-align:center}
#xrui button{font:600 14px system-ui;background:#0A2463;color:#fff;border:0;padding:10px 18px}
@media (max-width:760px){.prod,.arp{right:14px;top:auto;bottom:150px;width:auto;left:14px}}
body.embed #ui,body.embed #tip{display:none!important}
</style></head><body><div id="load">3D-Szene wird aufgebaut ...</div><div id="app"></div><div id="ui"></div><div id="tip"></div>
